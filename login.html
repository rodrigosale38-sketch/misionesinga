<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ingá | Acceso al Panel</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@700;900&family=Nunito+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f8f5ec;--card:#fff;--tx:#1b2a1e;--mu:#5a6a5e;--g1:#1f5a34;--g2:#143620;--ac:#e5891b;--ln:#dfe4d8;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 "Nunito Sans",system-ui,sans-serif;display:grid;place-items:center;min-height:100vh;padding:20px;}
.login-card{background:var(--card);border:1px solid var(--ln);padding:30px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,0.08);width:100%;max-width:380px;text-align:center;}
h2{font-family:Fraunces,Georgia,serif;color:var(--g1);margin-top:0;margin-bottom:20px;}
.login-input{width:100%;padding:12px 14px;border:1px solid var(--ln);border-radius:8px;background:var(--bg);color:var(--tx);margin-bottom:14px;font:inherit;}
.login-btn{background:var(--g1);color:#fff;border:0;padding:12px;border-radius:8px;font-weight:700;cursor:pointer;width:100%;font-size:1rem;transition:opacity .2s;}
.login-btn:hover{opacity:0.9;}
.error-msg{color:#c0392b;font-size:0.85rem;margin-top:10px;display:none;}
</style>
</head>
<body>

<div class="login-card">
    <h2>Panel Modo Dios</h2>
    <p style="color:var(--mu); font-size:0.9rem; margin-top:0; margin-bottom:20px;">Ingresa tus credenciales para administrar la tienda.</p>
    
    <form id="login-form">
        <input type="text" id="user" class="login-input" placeholder="Usuario (admin)" required>
        <input type="password" id="pass" class="login-input" placeholder="Contraseña (123456)" required>
        <button type="submit" class="login-btn">Entrar</button>
        <div id="error" class="error-msg">Usuario o contraseña incorrectos.</div>
    </form>
</div>

<script>
// Si ya está logueado, redirige directo al panel
if (localStorage.getItem('inga_admin_auth') === 'true') {
    window.location.href = 'admin.html';
}

document.getElementById('login-form').onsubmit = function(e) {
    e.preventDefault();
    const u = document.getElementById('user').value.trim();
    const p = document.getElementById('pass').value.trim();

    // Credenciales fijas pedidas: Usuario: admin, Contraseña: 123456
    if (u === 'admin' && p === '123456') {
        localStorage.setItem('inga_admin_auth', 'true');
        window.location.href = 'admin.html';
    } else {
        document.getElementById('error').style.display = 'block';
    }
};
</script>

</body>
</html>
